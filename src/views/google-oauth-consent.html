<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Sign-In - School Management System</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="centered-shell login-page-bg">
  <div class="card" style="width:100%;max-width:440px;padding:34px 32px;border-radius:24px;box-shadow:0 24px 60px rgba(15,32,75,0.16);">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px;">
      <div style="width:56px;height:56px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;margin-bottom:12px;">
        <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.5z"/>
        </svg>
      </div>
      <span class="badge badge-primary" style="margin-bottom:8px;">Google OAuth 2.0 Sandbox</span>
      <h1 style="margin:0 0 6px;font-size:22px;color:#0f172a;" id="gc-heading">Sign in with Google</h1>
      <p style="margin:0;font-size:13px;color:#64748b;" id="gc-subtitle">
        Continue to <strong id="gc-school-name">School Management System</strong>
      </p>
    </div>

    <div class="alert alert-info" style="font-size:12px;margin-bottom:16px;">
      Enter your Google email below to authenticate. Configure live Google Cloud OAuth keys in Superadmin Settings for external Google redirect.
    </div>

    <form method="POST" action="/auth/google/dev-authorize" id="gc-form" class="login-pill-form">
      <input type="hidden" name="state" id="gc-state">

      <div class="login-pill-field">
        <input
          type="email"
          name="email"
          id="gc-email"
          placeholder="Google Email Address"
          aria-label="Google Email Address"
          autocomplete="email"
          required
        >
      </div>

      <div class="login-pill-field">
        <input
          type="text"
          name="displayName"
          id="gc-name"
          placeholder="Full Name (for Google profile)"
          aria-label="Full Name"
        >
      </div>

      <div style="display:flex;gap:10px;justify-content:center;margin-top:8px;">
        <a href="/auth/google/callback?error=access_denied" id="gc-cancel-link" class="btn btn-secondary" style="border-radius:999px;padding:0 22px;height:42px;">
          Cancel
        </a>
        <button type="submit" id="gc-submit-btn" class="login-pill-submit" style="min-width:170px;height:42px;">
          CONTINUE
        </button>
      </div>
    </form>
  </div>

  <script src="/js/google-consent.js"></script>
</body>
</html>
